<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<style>
* { box-sizing: border-box; }
body {
    margin: 0; padding: 22px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif;
    background: #f7f7f5; color: #1a1a1a;
}
.panel {
    min-height: calc(100vh - 44px); padding: 20px;
    border: 1px solid #e7e7e3; border-radius: 14px;
    background: #fff; box-shadow: 0 8px 30px rgba(0,0,0,.08);
    display: flex; flex-direction: column;
}
.eyebrow { color: #2f6df6; font-size: .78rem; font-weight: 700; margin-bottom: 6px; }
h1 { margin: 0; font-size: 1.2rem; line-height: 1.35; }
.meta { margin-top: 5px; color: #888; font-size: .78rem; }
.note {
    margin-top: 16px; padding: 12px 14px; border-radius: 9px;
    background: #f2f2ef; line-height: 1.55; white-space: pre-wrap;
    overflow-wrap: anywhere; font-size: .9rem;
}
.image-wrap { margin-top: 14px; flex: 1; min-height: 0; }
.image-wrap:empty { display: none; }
.image-wrap img {
    display: block; width: 100%; max-height: 330px; object-fit: contain;
    object-position: top; border: 1px solid #e7e7e3; border-radius: 9px;
    background: #eee;
}
.actions { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 18px; }
.history-nav { display: none; align-items: center; gap: 7px; min-width: 0; }
.history-nav.show { display: flex; }
.history-position { min-width: 64px; color: #666; font-size: .78rem; text-align: center; white-space: nowrap; }
button {
    border: 0; border-radius: 8px; padding: 9px 18px;
    background: #111; color: #fff; cursor: pointer;
    font: inherit; font-size: .86rem; font-weight: 700;
}
button:hover { opacity: .78; }
.nav-btn { padding: 7px 10px; background: #ececea; color: #222; }
button:disabled { opacity: .3; cursor: default; }
@media (prefers-color-scheme: dark) {
    body { background: #202020; color: #fff; }
    .panel { background: #292929; border-color: #3a3a3a; }
    .meta { color: #aaa; }
    .history-position { color: #aaa; }
    .note { background: #363636; }
    .image-wrap img { border-color: #444; background: #181818; }
    button { background: #fff; color: #111; }
    .nav-btn { background: #444; color: #fff; }
}
</style>
</head>
<body>
<main class="panel">
    <div class="eyebrow" id="eyebrow">NEXT CLASS</div>
    <h1 id="title">지난 수업 진도</h1>
    <div class="meta" id="meta"></div>
    <div class="note" id="note"></div>
    <div class="image-wrap" id="imageWrap"></div>
    <div class="actions">
        <div class="history-nav" id="historyNav">
            <button class="nav-btn" id="previousRecordBtn" aria-label="이전 기록" onclick="changeRecord(-1)">〈</button>
            <span class="history-position" id="historyPosition"></span>
            <button class="nav-btn" id="nextRecordBtn" aria-label="다음 기록" onclick="changeRecord(1)">〉</button>
        </div>
        <button onclick="closePopup()">확인</button>
    </div>
</main>
<script>
let popupRecords = [];
let popupRecordIndex = 0;

function renderProgress(data) {
    data = data || {};
    if (Array.isArray(data.records) && data.records.length) {
        popupRecords = data.records;
        popupRecordIndex = Math.max(0, Math.min(
            popupRecords.length - 1, Number(data.initial_index) || 0));
    } else {
        popupRecords = [data];
        popupRecordIndex = 0;
    }
    renderCurrentRecord();
}

function renderCurrentRecord() {
    const data = popupRecords[popupRecordIndex] || {};
    document.getElementById('eyebrow').textContent = data.eyebrow || (data.preview ? 'PREVIEW' : 'NEXT CLASS');
    document.getElementById('title').textContent = data.title || '지난 수업 진도';
    document.getElementById('meta').textContent = data.meta || '';
    const note = document.getElementById('note');
    note.textContent = data.note || '';
    note.style.display = data.note ? 'block' : 'none';
    const imageWrap = document.getElementById('imageWrap');
    imageWrap.innerHTML = '';
    if (data.image_data_url) {
        const image = document.createElement('img');
        image.src = data.image_data_url;
        image.alt = '지난 수업 종료 화면';
        imageWrap.appendChild(image);
    }
    const hasHistory = popupRecords.length > 1;
    document.getElementById('historyNav').classList.toggle('show', hasHistory);
    document.getElementById('historyPosition').textContent =
        data.nav_label || `${popupRecordIndex + 1} / ${popupRecords.length}`;
    document.getElementById('previousRecordBtn').disabled = popupRecordIndex === 0;
    document.getElementById('nextRecordBtn').disabled = popupRecordIndex === popupRecords.length - 1;
}

function changeRecord(delta) {
    const next = Math.max(0, Math.min(popupRecords.length - 1, popupRecordIndex + delta));
    if (next === popupRecordIndex) return;
    popupRecordIndex = next;
    renderCurrentRecord();
}

async function init() {
    const data = await window.pywebview.api.get_progress_popup_data();
    renderProgress(data);
}

function closePopup() {
    window.pywebview.api.close_progress_popup();
}

window.addEventListener('pywebviewready', init);
</script>
</body>
</html>
