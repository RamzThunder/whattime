<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
* { box-sizing:border-box; }
:root { --bg:#f5f5f3; --panel:#fff; --text:#1b1b1b; --dim:#7f7f7f; --line:#e2e2de; --soft:#f1f1ee; }
body {
    margin:0; min-height:100vh; padding:20px; display:flex; align-items:center; justify-content:center;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic",sans-serif;
    background:var(--bg); color:var(--text);
}
.panel { width:100%; padding:21px; border:1px solid var(--line); border-radius:13px; background:var(--panel); box-shadow:0 8px 30px rgba(0,0,0,.08); }
h1 { margin:0; font-size:1.12rem; }
p { margin:8px 0 0; color:var(--dim); font-size:.82rem; line-height:1.55; }
.actions { display:flex; justify-content:flex-end; gap:8px; margin-top:20px; }
button { border:0; border-radius:8px; padding:9px 15px; cursor:pointer; font:inherit; font-size:.84rem; font-weight:700; }
.secondary { background:var(--soft); color:var(--text); }
.primary { background:#111; color:#fff; }
@media (prefers-color-scheme:dark) {
    :root { --bg:#202020; --panel:#292929; --text:#f5f5f5; --dim:#aaa; --line:#414141; --soft:#383838; }
    .primary { background:#fff; color:#111; }
}
</style>
</head>
<body>
<main class="panel">
    <h1>PowerPoint를 종료할까요?</h1>
    <p>수업이 아직 끝나지 않았다면 그대로 둘 수 있어요.<br>종료를 선택하면 저장하지 않은 문서는 PowerPoint가 다시 물어봅니다.</p>
    <div class="actions">
        <button class="secondary" onclick="keepOpen()">그대로 두기</button>
        <button class="primary" onclick="quitPowerPoint()">PowerPoint 종료</button>
    </div>
</main>
<script>
function keepOpen() {
    window.pywebview.api.close_powerpoint_quit_dialog();
}

function quitPowerPoint() {
    window.pywebview.api.confirm_powerpoint_quit();
}

document.addEventListener('keydown', event => {
    if (event.key === 'Escape') keepOpen();
    if (event.key === 'Enter') quitPowerPoint();
});
</script>
</body>
</html>
